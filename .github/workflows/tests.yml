name: Decision2Care tests
on: [push, pull_request]
jobs:
  synthetic-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,live]'
      - run: python -m pytest -q
      - run: bash scripts/run_synthetic.sh
